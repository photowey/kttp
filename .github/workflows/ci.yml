name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  distributions:
    name: Test and package Kttp
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test release validation and packaging
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Install virtual display for IDEA tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Run module tests and build installable plugin
        run: xvfb-run --auto-servernum ./gradlew --no-daemon test :idea:kttp-idea:buildPlugin :core:kttp-cli:shadowJar

      - name: Verify and stage plugin ZIP and CLI fat JAR
        run: python3 scripts/release.py stage --output build/ci-distributions

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kttp-distributions
          path: build/ci-distributions/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kttp-test-reports
          path: |
            core/*/build/reports/tests/
            idea/kttp-idea/build/reports/tests/
            core/*/build/test-results/
            idea/kttp-idea/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  documentation:
    name: Build bilingual documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: docs/design/uv.lock

      - name: Build documentation
        working-directory: docs/design
        run: |
          uv sync --locked
          uv run --locked mkdocs build --strict

      - name: Upload built documentation
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kttp-docs-site
          path: docs/design/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
