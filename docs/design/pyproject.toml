[project]
name = "kttp-docs"
version = "0.1.0"
description = "Bilingual documentation for Kttp's Kotlin HTTP client"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocs-material>=9.6.15,<10.0.0",
  "mkdocs-minify-plugin>=0.8.0,<1.0.0",
  "mkdocs-static-i18n>=1.3.0,<2.0.0",
  "pymdown-extensions>=10.15,<11.0.0",
]

[tool.uv]
package = false
